name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  comprobar:
    name: Comprobaciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Comprobar la sintaxis de PHP
        run: find escritoriowp -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Comprobar la sintaxis de JavaScript
        run: find escritoriowp/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Instalar herramientas de desarrollo
        run: composer install --no-interaction --prefer-dist

      - name: Estándar de codificación
        run: composer lint

      - name: Pruebas unitarias
        run: |
          php tests/ejecutar.php
          node tests/ejecutar.js

  publicar:
    name: Publicar la release
    needs: comprobar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que la versión del tag coincide con la del plugin
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CABECERA=$(grep -m1 '^ \* Version:' escritoriowp/escritoriowp.php | awk '{print $3}')
          ESTABLE=$(grep -m1 '^Stable tag:' escritoriowp/readme.txt | awk '{print $3}')
          echo "tag=$TAG cabecera=$CABECERA readme=$ESTABLE"
          test "$TAG" = "$CABECERA"
          test "$TAG" = "$ESTABLE"

      - name: Empaquetar el plugin
        run: zip -rq "escritoriowp-${GITHUB_REF_NAME#v}.zip" escritoriowp

      - name: Crear la release
        uses: softprops/action-gh-release@v2
        with:
          files: escritoriowp-*.zip
          generate_release_notes: true
