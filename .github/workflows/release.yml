name: Integración continua y publicación

# Cada push a main se comprueba entero. Si además la versión declarada en la cabecera del plugin
# todavía no tiene su tag, se crea el tag y se publica la release con el zip instalable.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Dos publicaciones simultáneas crearían dos releases de la misma versión.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: Versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.leer.outputs.version }}
      publicar: ${{ steps.leer.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sin el historial completo no se ven los tags ya publicados.
          fetch-depth: 0

      - name: Leer la versión y comprobar si ya tiene tag
        id: leer
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^ \* Version:' escritoriowp/escritoriowp.php | awk '{print $3}')

          if [ -z "$VERSION" ]; then
            echo "::error::La cabecera de escritoriowp/escritoriowp.php no declara ninguna versión."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            PUBLICAR=false
            echo "La versión $VERSION ya tiene el tag v$VERSION: no se publicará nada."
          else
            PUBLICAR=true
            echo "La versión $VERSION no tiene tag: se publicará si las comprobaciones pasan."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publicar=$PUBLICAR" >> "$GITHUB_OUTPUT"

  comprobar:
    name: Comprobaciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          extensions: zip
          tools: composer

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Comprobar la sintaxis de PHP
        run: find escritoriowp -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Comprobar la sintaxis de JavaScript
        run: find escritoriowp/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Instalar herramientas de desarrollo
        run: composer install --no-interaction --prefer-dist

      - name: Estándar de codificación
        run: composer lint

      - name: Pruebas unitarias
        run: |
          php tests/ejecutar.php
          node tests/ejecutar.js
          node tools/comprobar-contraste.js

      - name: Plugin Check (revisión del directorio de WordPress.org)
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: ./escritoriowp
          ignore-warnings: false
          # Ningún aviso se tolera en silencio. Cada código excluido lleva su motivo, y cualquier
          # problema nuevo que Plugin Check encuentre hace fallar el workflow.
          #
          # plugin_updater_detected: esta variante se distribuye por GitHub y declara «Update URI».
          #   El zip para el directorio oficial no lo lleva; lo genera «php tools/empaquetar.php
          #   --wordpress-org» y sobre él este código no aparece.
          # load_plugin_textdomainFound: la llamada solo sobra en plugins alojados en
          #   WordPress.org. Este se distribuye fuera y lleva sus propias traducciones en
          #   languages/, así que quitarla las dejaría sin cargar.
          #
          # Los dos siguientes son requisitos pendientes de decisión para poder enviar el plugin al
          # directorio oficial. Están documentados en docs/publicar-wordpress-org.md y hay que
          # resolverlos antes de enviarlo, no después.
          #
          # readme_*_non_official_language: desde 2025 el directorio exige el readme en inglés, y el
          #   de este plugin está en español, como el resto del proyecto.
          # trademarked_term: el directorio prohíbe «wp» en el nombre y en el slug, así que
          #   «EscritorioWP» y «escritoriowp» no son publicables tal cual.
          ignore-codes: |
            plugin_updater_detected
            PluginCheck.CodeAnalysis.DiscouragedFunctions.load_plugin_textdomainFound
            readme_short_description_non_official_language
            readme_description_non_official_language
            trademarked_term

  publicar:
    name: Publicar la release
    needs:
      - version
      - comprobar
    if: github.event_name == 'push' && needs.version.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          extensions: zip

      - name: Comprobar que las tres versiones coinciden
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          CABECERA=$(grep -m1 '^ \* Version:' escritoriowp/escritoriowp.php | awk '{print $3}')
          CONSTANTE=$(grep -m1 '^const VERSION' escritoriowp/escritoriowp.php | sed -E "s/.*'([^']+)'.*/\1/")
          ESTABLE=$(grep -m1 '^Stable tag:' escritoriowp/readme.txt | awk '{print $3}')
          echo "cabecera=$CABECERA constante=$CONSTANTE readme=$ESTABLE"

          if [ "$VERSION" != "$CABECERA" ] || [ "$VERSION" != "$CONSTANTE" ] || [ "$VERSION" != "$ESTABLE" ]; then
            echo "::error::Las versiones no coinciden: cabecera=$CABECERA constante=$CONSTANTE Stable tag=$ESTABLE"
            exit 1
          fi

      - name: Comprobar que readme.txt tiene la entrada del changelog
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -qE "^= ${VERSION} =[[:space:]]*$" escritoriowp/readme.txt; then
            echo "::error::readme.txt no tiene la entrada «= $VERSION =» en su changelog."
            exit 1
          fi

      - name: Generar las notas de la release desde CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: php tools/notas-release.php "$VERSION" > notas-release.md

      - name: Empaquetar el plugin
        run: php tools/empaquetar.php

      - name: Crear el tag y la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.version }}
          body_path: notas-release.md
          files: dist/escritoriowp-*.zip
          make_latest: true
